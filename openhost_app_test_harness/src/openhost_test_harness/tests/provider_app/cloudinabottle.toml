[app]
name = "echo-provider"
version = "0.1.0"
description = "Fixture provider app for harness self-tests"
hidden = true

[runtime.container]
image = "Dockerfile"
port = 5000

[routing]
health_check = "/health"

# All storage tiers, so the harness self-test covers archive-using apps and the data dir accessors.
[data]
app_data = true
app_temp_data = true
app_archive = true

[resources]
memory_mb = 64
cpu_cores = 0.1

[[services.v2.provides]]
service = "github.com/example/echo"
version = "0.1.0"
endpoint = "/svc/"
